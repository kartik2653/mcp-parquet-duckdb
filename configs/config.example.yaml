listen_addr: ":8080"
transport: http
data_dir: ./data/parquet
datasets:
  - name: charge
    file: ./data/parquet/charge.parquet
    description: Vehicle charging records
    metadata: ./configs/charge.metadata.yaml
  - name: distance
    file: ./data/parquet/distance.parquet
    description: Vehicle trip and distance records
    metadata: ./configs/distance.metadata.yaml
  - name: geofence
    file: ./data/parquet/geofence.parquet
    description: Geofence-related records
    metadata: ./configs/geofence.metadata.yaml
  - name: alert_report
    file: ./data/parquet/alert_report.parquet
    description: Vehicle alerts and report records
    metadata: ./configs/alert_report.metadata.yaml
relationships: []
duckdb_memory_limit: 512MB
temp_dir: ./data/tmp
query_timeout: 30s
max_concurrent_queries: 4
max_result_rows: 100
max_groups: 100
max_histogram_bins: 20
auth_token: change-me
log_level: info
default_timezone: UTC
max_request_bytes: 1048576
